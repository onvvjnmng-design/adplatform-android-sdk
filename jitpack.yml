jdk:
  - openjdk17
before_install:
  - curl -sL -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/nicoulaj/gradle-wrapper/main/gradle-wrapper.jar || wget -q -O gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/nicoulaj/gradle-wrapper/main/gradle-wrapper.jar
  - chmod +x gradlew
install:
  - ./gradlew :ad-sdk:assembleRelease :ad-sdk:publishToMavenLocal

