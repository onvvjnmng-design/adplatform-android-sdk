jdk:
  - openjdk11
before_install:
  - sdk install java 11.0.12-open || true
  - sdk use java 11.0.12-open || true
  - export JAVA_HOME=$(sdk home java 11.0.12-open 2>/dev/null || echo $JAVA_HOME)
  - java -version
  - wget -q https://services.gradle.org/distributions/gradle-7.6.3-bin.zip -O /tmp/gradle.zip
  - unzip -q /tmp/gradle.zip -d $HOME
install:
  - $HOME/gradle-7.6.3/bin/gradle :ad-sdk:assembleRelease :ad-sdk:publishToMavenLocal

